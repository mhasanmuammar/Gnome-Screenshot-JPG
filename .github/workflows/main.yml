name: CI Verification Loop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-codebase:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Verify Environment Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Pillow
        
    - name: Validate Python Script Syntax
      run: |
        python -m py_compile gnome-screenshot-jpg.sh
